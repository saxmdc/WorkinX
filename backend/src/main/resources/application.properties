# =============================================
# WorkInX - Spring Boot Configuration
# Equivalente al .env del backend Node.js
# =============================================

# Puerto del servidor (mismo que el original)
server.port=3000

# ---- Base de Datos MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/workinx?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones HikariCP (equivalente a connectionLimit=10)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Desactivar Hibernate auto-ddl (usamos el SQL existente)
spring.jpa.hibernate.ddl-auto=none

# ---- JWT ----
jwt.secret=tu_secreto_super_seguro
jwt.expiration=7200000

# ---- URL de la App (para generar URLs de archivos) ----
app.url=http://localhost:3000

# ---- Directorio de uploads ----
app.uploads.dir=uploads

# ---- Multipart (Multer equivalente: max 5MB) ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ---- Logging ----
logging.level.com.workinx=DEBUG
logging.level.org.springframework.security=WARN
