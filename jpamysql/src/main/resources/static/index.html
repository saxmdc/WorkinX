<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empresas | JPA Microservicio WorkInX</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <h1>Empresas<span class="gradient-text">JPA</span> (WorkInX)</h1>
            <div class="search-bar">
                <select id="searchType" class="glass-input">
                    <option value="id">Buscar por ID</option>
                    <option value="and">Buscar: Industria Y Dirección (AND)</option>
                    <option value="or">Buscar: Nombre O Industria O Desc (OR)</option>
                </select>
                <input type="text" id="searchInput" placeholder="Buscar..." class="glass-input">
                <input type="text" id="searchExtra1" placeholder="Dirección (para AND)" class="glass-input hidden">
                <input type="text" id="searchExtra2" placeholder="Descripción (para OR)" class="glass-input hidden">
                <button id="btnSearch" class="btn-primary">Buscar</button>
                <button id="btnReset" class="btn-secondary">Mostrar Todos</button>
            </div>
        </header>

        <main class="main-content">
            <!-- Formulario de Empresa (CRUD: Crear / Editar) -->
            <aside class="form-panel glass-panel">
                <h2 id="formTitle">Nueva Empresa</h2>
                
                <!-- Alerta visual destacada para errores de validación -->
                <div id="formAlert" class="alert alert-danger hidden"></div>

                <form id="empresaForm" novalidate>
                    <input type="hidden" id="empresaId">
                    
                    <div class="input-group">
                        <label for="nombreEmpresa">Nombre de Empresa *</label>
                        <input type="text" id="nombreEmpresa" class="glass-input" placeholder="Ej. Soluciones Tech S.A.S">
                        <span class="field-error-msg hidden" id="err-nombreEmpresa"></span>
                    </div>

                    <div class="input-group">
                        <label for="industria">Industria / Sector *</label>
                        <input type="text" id="industria" class="glass-input" placeholder="Ej. Software o Salud">
                        <span class="field-error-msg hidden" id="err-industria"></span>
                    </div>

                    <div class="input-group">
                        <label for="telefonoContacto">Teléfono</label>
                        <input type="text" id="telefonoContacto" class="glass-input" placeholder="Ej. 3001234567">
                        <span class="field-error-msg hidden" id="err-telefonoContacto"></span>
                    </div>

                    <div class="input-group">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" class="glass-input" placeholder="Ej. Calle 50 # 40 - 20">
                        <span class="field-error-msg hidden" id="err-direccion"></span>
                    </div>

                    <div class="input-group">
                        <label for="sitioWeb">Sitio Web</label>
                        <input type="url" id="sitioWeb" class="glass-input" placeholder="https://empresa.com">
                        <span class="field-error-msg hidden" id="err-sitioWeb"></span>
                    </div>

                    <div class="input-group">
                        <label for="descripcion">Descripción</label>
                        <input type="text" id="descripcion" class="glass-input" placeholder="Breve descripción">
                        <span class="field-error-msg hidden" id="err-descripcion"></span>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="btnSubmit" class="btn-primary">Guardar Empresa</button>
                        <button type="button" id="btnCancel" class="btn-secondary hidden">Cancelar</button>
                    </div>
                </form>
            </aside>

            <!-- Tabla de Empresas -->
            <section class="table-panel glass-panel">
                <div class="table-header">
                    <h2>Directorio de Empresas (Base de Datos MySQL)</h2>
                    <span id="badgeCount" class="badge">0 empresas</span>
                </div>
                
                <div class="table-responsive">
                    <table class="glass-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Empresa</th>
                                <th>Industria</th>
                                <th>Teléfono</th>
                                <th>Dirección</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Filas cargadas dinámicamente por JS -->
                        </tbody>
                    </table>
                </div>

                <!-- ── PAGINACIÓN (RETO 5) ───────────────────────────────── -->
                <div class="pagination-bar" id="paginationBar">
                    <div class="pagination-info">
                        <span id="pageInfo">Página 1 de 1</span>
                        <span id="totalInfo" style="margin-left:1rem; color: var(--text-muted);">0 registros</span>
                    </div>
                    <div class="pagination-controls">
                        <label for="pageSize" style="font-size:0.85rem; color:var(--text-muted);">Mostrar:</label>
                        <select id="pageSize" class="glass-input page-size-select">
                            <option value="5" selected>5</option>
                            <option value="10">10</option>
                            <option value="20">20</option>
                        </select>
                        <button id="btnFirst" class="btn-page" title="Primera página">«</button>
                        <button id="btnPrev"  class="btn-page" title="Página anterior">‹</button>
                        <div id="pageNumbers" class="page-numbers"></div>
                        <button id="btnNext"  class="btn-page" title="Página siguiente">›</button>
                        <button id="btnLast"  class="btn-page" title="Última página">»</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Contenedor para notificaciones flotantes -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js?v=2.0"></script>
</body>
</html>
